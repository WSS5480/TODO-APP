<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Todo Reminder</title>

  <!-- Home-screen install. iOS ignores the SVG favicon and the manifest icons,
       so it needs its own PNG apple-touch-icon. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
  <!-- older iOS only looks for the -precomposed name -->
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#16213f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Todo" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <div class="update" id="update" hidden role="status">
      <span class="update-msg">A new version is available.</span>
      <button id="updateBtn" type="button">Update now</button>
      <button id="updateDismiss" class="update-x" type="button" aria-label="Dismiss">&#10005;</button>
    </div>
    <header class="top">
      <h1>Todo Reminder</h1>
      <div class="sub">Local-only. Keep this tab open and alarms ring at the due time.</div>
    </header>
    <form id="form">
      <input id="task" type="text" placeholder="What needs doing?" required maxlength="200" />
      <input id="when" type="datetime-local" title="Due date & time (optional)" />
      <select id="prio" title="Priority">
        <option value="low">Low</option>
        <option value="med" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <!-- options filled from the sound library in main.js -->
      <select id="taskSound" title="Alarm for this task (optional)"></select>
      <button type="submit">Add</button>
    </form>
    <div class="settings">
      <button class="ghost toggle on" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
      <label class="lead">Heads-up
        <select id="lead" title="Also alert this long before a task is due">
          <option value="0">off</option>
          <option value="5">5 min before</option>
          <option value="10" selected>10 min before</option>
          <option value="15">15 min before</option>
          <option value="30">30 min before</option>
          <option value="60">1 hour before</option>
        </select>
      </label>
      <label class="lead">Repeat
        <select id="repeat" title="How many times a due alarm rings">
          <option value="1" selected>once</option>
          <option value="3">3 times</option>
          <option value="5">5 times</option>
          <option value="30">until dismissed</option>
        </select>
      </label>
      <button class="ghost" id="notifyBtn" type="button">Enable notifications</button>
    </div>
    <!-- tap a sound to pick it and hear it; chips beat a dropdown on a phone -->
    <details class="sounds" id="soundPanel">
      <summary>Alarm sounds</summary>
      <div class="sound-group">
        <span class="sound-label">When a task is due</span>
        <div class="sound-picker" id="dueSound" role="radiogroup" aria-label="Alarm sound"></div>
      </div>
      <div class="sound-group">
        <span class="sound-label">Heads-up warning</span>
        <div class="sound-picker" id="soonSound" role="radiogroup" aria-label="Heads-up sound"></div>
      </div>
      <p class="sound-hint">Tap any sound to hear it.</p>
    </details>
    <div class="toolbar">
      <span id="count">0 active</span>
      <button class="ghost" id="clearBtn" type="button">Clear done</button>
    </div>
    <ul id="list"></ul>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
